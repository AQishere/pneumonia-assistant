services:
  - type: web
    name: pneumonia-assistant-api
    runtime: python
    plan: free
    rootDir: pneumonia-assistant
    buildCommand: pip install -r requirements.txt
    # One worker keeps memory well under the free tier's 512 MB.
    startCommand: uvicorn api.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DB_BACKEND
        value: firestore
      # Upload the service-account JSON as a Secret File with this name.
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-adminsdk.json
      - key: FIREBASE_PROJECT_ID
        value: pneuomnia-assistant
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      # Secrets and the Vercel URL are entered in the Render dashboard.
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
